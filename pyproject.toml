[project]
name = "personal-website"
version = "0.1.0"
description = "Личный сайт Python-разработчика Владимира Воронова"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cssmin>=0.2.0",  # JS не минифицируется; rjsmin не ставим, пока не вернём filters="rjsmin"
